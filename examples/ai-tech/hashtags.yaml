# Hashtag Strategy for AI/Tech Niche

## Rules
# 4-5 hashtags per post
# Lowercase, no PascalCase
# Placement: end of post text
# Never generic filler unless directly relevant
# Rotate niche tags — don't repeat exact same set on consecutive posts

## Always Include (Every Post)
always:
  - "#ainews"
  - "#ai"
  - "#generativeai"

